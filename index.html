<script>
  // Solo redirige si se abre desde el inicio (standalone) o con ?go=1,

      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    var go = /[?&]go=1(&|$)/.test(location.search);
    if (standalone || go) location.replace(URL_APP);
  })();
</script>
